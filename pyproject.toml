[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docdecision"
version = "0.1.0"
description = "Read incoming documents and suggest a decision using declarative rules."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]

[project.scripts]
docdecision = "docdecision.__main__:main"

[tool.setuptools]
packages = ["docdecision"]
